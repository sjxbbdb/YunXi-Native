yunxi-agent-provider = { path = "../crates/yunxi-agent-provider" }
yunxi-agent-runtime = { path = "../crates/yunxi-agent-runtime" }
yunxi-agent-sandbox = { path = "../crates/yunxi-agent-sandbox" }
yunxi-agent-storage = { path = "../crates/yunxi-agent-storage" }
yunxi-agent-tui = { path = "../crates/yunxi-agent-tui" }
